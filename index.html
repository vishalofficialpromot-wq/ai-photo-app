<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Photo Creator</title>

<style>
    body {
        font-family: Arial;
        text-align: center;
        padding: 20px;
    }
    button {
        padding: 12px 22px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }
    #outputImg {
        margin-top: 20px;
        max-width: 90%;
        border-radius: 10px;
        box-shadow: 0 0 10px #aaa;
    }
</style>

</head>
<body>

<h2>AI Photo Creator</h2>

<p>नीचे अपना prompt लिखें (कैसा फोटो बनवाना है)</p>

<input id="prompt" style="width:80%;padding:10px;font-size:16px;border-radius:8px;"><br><br>

<button onclick="generate()">Generate Photo</button>

<h3 id="status"></h3>

<img id="outputImg"/>

<script>
async function generate() {
    let prompt = document.getElementById('prompt').value;
    if (!prompt) {
        alert("Papa ji, prompt likh do!");
        return;
    }

    document.getElementById("status").innerText = "Please wait… generating…";

    const response = await fetch("https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt));
    document.getElementById("outputImg").src = response.url;
    
    document.getElementById("status").innerText = "Done!";
}
</script>

</body>
</html>
